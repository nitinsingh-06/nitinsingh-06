<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 495 195" width="495px" height="195px">
  <defs>
    <clipPath id="outer_rectangle">
      <rect width="495" height="195" rx="8"/>
    </clipPath>
  </defs>

  <style>
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes currstreak {
      0% { font-size: 3px; opacity: 0.2; }
      80% { font-size: 34px; opacity: 1; }
      100% { font-size: 28px; opacity: 1; }
    }
    .number {
      fill: #ffffff;
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
    }
    .label {
      fill: #00F75D;
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      font-size: 14px;
      text-anchor: middle;
    }
    .range {
      fill: #a3a3a3;
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      font-size: 11px;
      text-anchor: middle;
    }
  </style>

  <g clip-path="url(#outer_rectangle)">
    <rect width="495" height="195" rx="8" fill="#0d1117" stroke="#30363d"/>

